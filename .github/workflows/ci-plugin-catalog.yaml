name: CI Plugin Catalog

on:
  push:
    branches: [main]
    paths:
      - "tests/test_plugin_catalog.py"
      - "tests/test_repository_policy.py"
      - "deny.toml"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "tools/plugin_catalog.py"
      - "tools/validate_ci_selection.py"
      - "pyproject.toml"
      - "uv.lock"
      - "plugins/rust/python-package/*/pyproject.toml"
      - "plugins/rust/python-package/*/uv.lock"
      - "plugins/python/**"
      - "plugins/rust/python-package/*/Cargo.toml"
      - "plugins/rust/python-package/*/cpex_*/plugin-manifest.yaml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test_plugin_catalog.py"
      - "tests/test_repository_policy.py"
      - "deny.toml"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "tools/plugin_catalog.py"
      - "tools/validate_ci_selection.py"
      - "pyproject.toml"
      - "uv.lock"
      - "plugins/rust/python-package/*/pyproject.toml"
      - "plugins/rust/python-package/*/uv.lock"
      - "plugins/python/**"
      - "plugins/rust/python-package/*/Cargo.toml"
      - "plugins/rust/python-package/*/cpex_*/plugin-manifest.yaml"

concurrency:
  group: ci-plugin-catalog-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate repository catalog
        run: python3 tools/plugin_catalog.py validate .

      - name: Run catalog behavior and repository policy tests
        run: python3 -m unittest tests/test_plugin_catalog.py tests/test_repository_policy.py
