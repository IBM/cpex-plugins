version: 2
updates:
  # Rust/Cargo workspace dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    groups:
      # Keep each ecosystem in a single update PR, including 0.x minor bumps.
      rust-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - rust
    open-pull-requests-limit: 1

  # Python dependencies — root uv workspace (all plugins via pyproject.toml)
  - package-ecosystem: uv
    directory: /
    # Match tool.uv.exclude-newer in pyproject.toml.
    cooldown:
      default-days: 10
      exclude:
        - certifi
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - "python:uv"
    open-pull-requests-limit: 1

  # GitHub Actions pinned-SHA bumps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1
