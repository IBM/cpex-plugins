description: "Rate limiting by user, user/server, tenant, and tool — memory or Redis backends"
author: "ContextForge Contributors"
version: "0.1.11"
kind: "cpex_rate_limiter.rate_limiter.RateLimiterPlugin"
available_hooks:
  - "prompt_pre_fetch"
  - "tool_pre_invoke"
default_configs:
  by_user: "60/m"
  by_user_per_server: null
  by_tenant: "600/m"
  by_tool: {}
